<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>投喂小沫娘 · 打赏</title>
<style>
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(160deg,#0f2027,#203a43,#2c5364);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#eaf6ff}
 .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:20px;
       padding:28px 26px 22px;max-width:380px;width:88%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
 h1{font-size:20px;margin:0 0 6px}
 p.sub{font-size:13px;opacity:.75;margin:0 0 18px;line-height:1.6}
 img{width:100%;border-radius:14px;background:#fff;padding:10px;box-sizing:border-box;display:block}
 .tip{margin-top:14px;font-size:12px;opacity:.6;line-height:1.7}
 .fish{margin-top:10px;font-size:22px}
</style></head>
<body><div class="card">
  <h1>投喂小沫娘 🦊</h1>
  <p class="sub">谢谢你请我吃鱼排～<br>扫码打赏，多少都是心意，我会记得的。</p>
  <img alt="打赏收款码" src="qr.png">
  <div class="tip">长按/右键可保存收款码<br>仅用于打赏，不会用于其他用途</div>
  <div class="fish">🐟🐋🐟</div>
</div></body></html>
